<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <!-- Metallic gold linear gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C6212" />
      <stop offset="20%" stop-color="#B4914C" />
      <stop offset="50%" stop-color="#F1D784" />
      <stop offset="80%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B4914C" />
    </linearGradient>
    
    <!-- Soft shadow glow -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Left: Stylized Emblem (Golden Horn inside Circular Badge) -->
  <g transform="translate(5, 5)">
    <!-- Badge Background -->
    <circle cx="35" cy="35" r="33" fill="#1A4D2E" stroke="url(#goldGradient)" stroke-width="2" />
    <circle cx="35" cy="35" r="29" fill="none" stroke="url(#goldGradient)" stroke-width="0.75" stroke-dasharray="3,2" opacity="0.6" />

    <!-- stylized Golden Horn representation -->
    <g filter="url(#softGlow)" transform="translate(10, 10)">
      <!-- Segment 1: Curved Pointy Tip of the Horn of Plenty (Leftmost) -->
      <path d="M 6 14 C 5 12, 3 12, 2 16 C 1 20, 3 24, 6 26 C 8 27, 9 25, 8 22 C 7 20, 5 19, 5 17 C 6 15, 6 15, 6 14 Z" fill="url(#goldGradient)" />
      
      <!-- Segment 2: Small body curve -->
      <path d="M 6 21 C 7 18, 8 16, 10 17 C 12 17, 13 19, 13 23 C 12 26, 11 28, 8 27 C 7 27, 6 25, 6 21 Z" fill="url(#goldGradient)" />
      
      <!-- Segment 3: Medium body curve -->
      <path d="M 11 22 C 11 18, 13 16, 16 17 C 19 17, 20 20, 20 25 C 19 29, 17 32, 13 30 C 11 30, 10 27, 11 22 Z" fill="url(#goldGradient)" />
      
      <!-- Segment 4: Larger mid-body section -->
      <path d="M 17 24 C 17 19, 20 16, 24 17 C 27 17, 29 21, 29 27 C 28 32, 25 35, 20 33 C 18 33, 16 29, 17 24 Z" fill="url(#goldGradient)" />
      
      <!-- Segment 5: Big collar segment leading to rim -->
      <path d="M 24 26 C 25 20, 29 16, 33 17 C 37 17, 39 23, 39 29 C 38 35, 34 39, 28 37 C 26 36, 24 32, 24 26 Z" fill="url(#goldGradient)" />
      
      <!-- Segment 6: Elegant opening rim of the Horn -->
      <path d="M 33 17 C 36 17, 41 21, 41 28 C 41 34, 37 38, 34 38 C 31 38, 30 33, 30 27 C 30 21, 31 17, 33 17 Z M 33 19 C 31 19, 31 22, 31 27 C 31 32, 31 36, 33 36 C 35 36, 39 33, 39 28 C 39 22, 35 19, 33 19 Z" fill="url(#goldGradient)" fill-rule="evenodd" />
    </g>
  </g>

  <!-- Right: Elegant Royal Typography -->
  <g transform="translate(85, 0)">
    <!-- "Horn & Harvest" text in classic serif styling -->
    <text x="0" y="38" font-family="'Cinzel', 'Playfair Display', 'Didot', 'Georgia', 'Times New Roman', serif" font-size="25" font-weight="700" fill="#1A4D2E" letter-spacing="1.5">
      Horn <tspan fill="#D4AF37" font-style="italic" font-weight="300">&amp;</tspan> Harvest
    </text>

    <!-- "SOMALIA'S LEGENDARY FRUITS" secondary label -->
    <text x="2" y="55" font-family="'Inter', 'Space Grotesk', 'Montserrat', 'Helvetica', sans-serif" font-size="9.5" font-weight="400" fill="#D4AF37" letter-spacing="3.5" opacity="0.95">
      SOMALIA'S EXOTIC FRUITS
    </text>

    <!-- "PREMIUM EST. 2026" subtext -->
    <text x="2.5" y="68" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="6.5" font-weight="500" fill="#A2A2A2" letter-spacing="5" opacity="0.75">
      HERITAGE OF SOMALIA
    </text>
  </g>
</svg>
