# Merge into Julian's existing HTTPS vhost; keep the current TLS/certificate setup.
# Do NOT serve the project folder as a public document root.
server {
    listen 443 ssl;
    server_name hornandharvest.com www.hornandharvest.com;
    ssl_certificate /etc/letsencrypt/live/hornandharvest.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hornandharvest.com/privkey.pem;
    client_max_body_size 8m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
