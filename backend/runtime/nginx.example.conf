# Replace domain/certificate paths and PORT to match the actual host.
# This configuration is an example to adapt, not a credential-bearing file.
server {
    listen 80;
    server_name hornandharvest.com www.hornandharvest.com;
    return 301 https://hornandharvest.com$request_uri;
}
server {
    listen 443 ssl;
    server_name hornandharvest.com www.hornandharvest.com;
    ssl_certificate /PATH/TO/fullchain.pem;
    ssl_certificate_key /PATH/TO/privkey.pem;
    client_max_body_size 8m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
