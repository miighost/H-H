name: horn_harvest_driver
description: Horn & Harvest assigned delivery client using the existing Firebase identity and operations API.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  geolocator: ^14.1.1
  sqflite: ^2.4.2
  http: ^1.4.0
  image_picker: ^1.1.2
  uuid: ^4.5.1
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
